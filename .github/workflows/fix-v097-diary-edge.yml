name: Fix 0.9.7 diary edge cases once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v097-diary-edge.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve labels and count only technique-active days
        run: |
          set -euo pipefail
          FILE='app/src/main/java/com/valera2872/bjjarm/PremiumTrainingDiaryV2Activity.java'
          sed -i 's/Открытая тренировка/Открытый ковёр/' "$FILE"
          sed -i 's@            totals.days.add(day);@            if (item.optInt("attempts") > 0 || item.optInt("successes") > 0 || item.optInt("finishes") > 0) totals.days.add(day);@' "$FILE"
          sed -i 's@            if (totals.latestDay == null || day.compareTo(totals.latestDay) > 0) totals.latestDay = day;@            if ((item.optInt("attempts") > 0 || item.optInt("successes") > 0 || item.optInt("finishes") > 0) \&\& (totals.latestDay == null || day.compareTo(totals.latestDay) > 0)) totals.latestDay = day;@' "$FILE"
          grep -q 'Открытый ковёр' "$FILE"
          grep -q 'item.optInt("attempts") > 0' "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Fix 0.9.7 diary active-day recalculation'
          git push origin main

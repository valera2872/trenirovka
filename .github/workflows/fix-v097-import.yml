name: Fix 0.9.7 import once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v097-import.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct ActivityNotFoundException import
        run: |
          set -euo pipefail
          FILE='app/src/main/java/com/valera2872/bjjarm/PremiumTrainingDiaryV2Activity.java'
          sed -i 's/import android\.app\.ActivityNotFoundException;/import android.content.ActivityNotFoundException;/' "$FILE"
          grep -q 'import android.content.ActivityNotFoundException;' "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Fix ActivityNotFoundException import in 0.9.7 diary'
          git push origin main

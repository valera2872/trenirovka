name: Fix 0.10.0 premium pass once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v100-premium-pass.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply compile and UX corrections
        run: |
          set -euo pipefail
          MAIN='app/src/main/java/com/valera2872/bjjarm/CombatPerformanceV100Activity.java'
          DIARY='app/src/main/java/com/valera2872/bjjarm/PremiumDarkDiaryActivity.java'
          sed -i 's/card\.setMinHeight(DarkUi\.dp(this, 106));/card.setMinimumHeight(DarkUi.dp(this, 106));/' "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/valera2872/bjjarm/CombatPerformanceV100Activity.java')
          text = main.read_text(encoding='utf-8')
          old = '''    private String shortMission() {
        String m = profile.getString("mission", "Техника не выбрана").trim();
        return m.length() > 34 ? m.substring(0, 34) + "…" : m;
    }'''
          new = '''    private String shortMission() {
        return profile.getString("mission", "Техника не выбрана").trim();
    }'''
          if old not in text:
              raise SystemExit('shortMission block not found')
          main.write_text(text.replace(old, new), encoding='utf-8')

          diary = Path('app/src/main/java/com/valera2872/bjjarm/PremiumDarkDiaryActivity.java')
          text = diary.read_text(encoding='utf-8')
          old = 'back.setOnClickListener(v->showHome());'
          new = 'back.setOnClickListener(v -> { if ("Дневник".equals(title)) finish(); else showHome(); });'
          if old not in text:
              raise SystemExit('diary back handler not found')
          diary.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'setMinimumHeight(DarkUi.dp(this, 106))' "$MAIN"
          ! grep -q 'substring(0, 34)' "$MAIN"
          grep -q '"Дневник".equals(title)' "$DIARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MAIN" "$DIARY"
          git commit -m 'Fix premium 0.10.0 compile and text wrapping'
          git push origin main

# updated to trigger after workflow registration
